<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SICOR PDF → Excel</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:50px;
    background:#f4f4f4;
}
.container{
    background:white;
    padding:30px;
    max-width:700px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
button{
    background:#0070f3;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
    <h1>Conversor SICOR PDF → Excel</h1>
    <p>Subí tu PDF SICOR y conviértelo a Excel.</p>

    <input type="file" accept=".pdf">

    <br><br>

    <button>Convertir PDF</button>
</div>

</body>
</html>
